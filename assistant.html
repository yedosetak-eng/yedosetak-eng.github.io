<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e2382b'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b0d10;
    --panel:#12151a;
    --panel-2:#171b21;
    --line:#242a33;
    --line-soft:#1b2028;
    --text:#e9e7e4;
    --muted:#8b929c;
    --accent:#e2382b;
    --accent-dark:#b32a20;
    --accent-soft:rgba(226,56,43,.12);
    --ok:#3fb950;
    --warn:#f0a020;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--text);
    background:
      radial-gradient(900px 420px at 50% -160px, rgba(226,56,43,.17), transparent 70%),
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  .app{
    height:100dvh;
    max-width:840px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding:0 14px calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 2px 12px;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:34px;height:34px;flex:0 0 34px;border-radius:11px;
    background:linear-gradient(150deg,#ff5140,#a8211a);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 18px -8px rgba(226,56,43,.9);
    position:relative;
  }
  .mark::after{
    content:"";position:absolute;inset:0;border-radius:11px;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 60%);
  }
  .brand-txt{min-width:0}
  .brand-txt h1{
    margin:0;font-size:14px;letter-spacing:.22em;font-weight:700;text-transform:uppercase;
  }
  .status{
    margin:3px 0 0;font-size:11.5px;color:var(--muted);
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:0 0 6px}
  .status[data-state="ok"] .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.14)}
  .status[data-state="checking"] .dot{background:var(--warn);animation:blink 1.1s ease-in-out infinite}
  .status[data-state="error"] .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(226,56,43,.16)}
  @keyframes blink{50%{opacity:.25}}
  .icon-btn{
    flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--muted);
    transition:.15s ease;
  }
  .icon-btn:hover{color:var(--text);border-color:#31394a}
  .icon-btn:active{transform:scale(.96)}

  /* ---------- chat ---------- */
  .chat{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:6px 2px 10px;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .chat::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb{background:#242a33;border-radius:8px}

  .welcome{
    border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(180deg,rgba(226,56,43,.07),rgba(23,27,33,.4));
    padding:20px;margin:22px 0 10px;
  }
  .welcome h2{margin:0 0 8px;font-size:16px;font-weight:650}
  .welcome p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
  .welcome ul{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
  .welcome li{padding:5px 0 5px 16px;position:relative}
  .welcome li::before{
    content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75;
  }

  .msg{display:flex;flex-direction:column;margin:0 0 14px;animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .msg.user{align-items:flex-end}
  .msg.bot{align-items:flex-start}
  .bubble{
    max-width:min(84%,640px);
    padding:11px 14px;
    border-radius:var(--radius);
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    font-size:15px;
    line-height:1.62;
  }
  .msg.user .bubble{
    background:linear-gradient(160deg,#e2382b,#bf2c22);
    color:#fff;border-bottom-right-radius:6px;
    box-shadow:0 8px 20px -14px rgba(226,56,43,.9);
  }
  .msg.bot .bubble{
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:6px;
  }
  .msg.bot.error .bubble{border-color:rgba(226,56,43,.45);background:rgba(226,56,43,.07)}
  .bubble strong{font-weight:700}
  .bubble code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
    background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;
  }
  .stamp{font-size:10.5px;color:#5c646f;margin:5px 4px 0;letter-spacing:.02em}

  .typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:block;animation:tp 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes tp{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- chips ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;white-space:nowrap;
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:13px;color:#c8ccd2;transition:.15s ease;
  }
  .chip:hover{border-color:rgba(226,56,43,.5);color:var(--text);background:var(--accent-soft)}
  .chip:active{transform:scale(.97)}
  .chip[disabled]{opacity:.45;pointer-events:none}

  /* ---------- composer ---------- */
  .composer{
    display:flex;align-items:flex-end;gap:9px;
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:7px 7px 7px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within{border-color:rgba(226,56,43,.55);box-shadow:0 0 0 3px rgba(226,56,43,.1)}
  textarea{
    flex:1 1 auto;min-height:26px;max-height:140px;resize:none;
    background:transparent;border:0;outline:0;color:var(--text);
    font:inherit;font-size:16px;line-height:1.45;
    padding:6px 0;
    font-family:inherit;
  }
  textarea::placeholder{color:#5f6772}
  .send{
    flex:0 0 auto;width:38px;height:38px;border-radius:13px;border:0;
    background:linear-gradient(160deg,#ff4b3c,#c22c22);
    display:grid;place-items:center;color:#fff;
    transition:.15s ease;
  }
  .send:hover{filter:brightness(1.08)}
  .send:active{transform:scale(.95)}
  .send[disabled]{background:#2a3038;color:#6a7280;cursor:default;transform:none;filter:none}
  .hint{margin:8px 2px 0;font-size:11px;color:#565e69;text-align:center;letter-spacing:.01em}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(4,5,7,.72);backdrop-filter:blur(6px);
    padding:18px;
    align-items:center;justify-content:center;
  }
  .modal.open{display:flex}
  .sheet{
    width:100%;max-width:440px;max-height:calc(100dvh - 40px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:22px;box-shadow:0 30px 80px -30px #000;
    animation:rise .2s ease-out;
  }
  .sheet h2{margin:0 0 4px;font-size:17px;letter-spacing:.01em}
  .sheet .sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.6}
  .field{margin:0 0 14px}
  .field label{display:block;font-size:12px;color:#a8aeb8;margin:0 0 6px;letter-spacing:.02em}
  .field input{
    width:100%;background:#0d1014;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;color:var(--text);font:inherit;font-size:15px;outline:0;
    transition:border-color .15s ease;
  }
  .field input:focus{border-color:rgba(226,56,43,.6)}
  .field input::placeholder{color:#4e5661;font-size:13px}
  .note{
    font-size:11.5px;color:#727a85;line-height:1.6;
    border-left:2px solid var(--line);padding-left:10px;margin:0 0 16px;
  }
  .modal-err{
    display:none;font-size:12.5px;color:#ff9a90;
    background:rgba(226,56,43,.1);border:1px solid rgba(226,56,43,.32);
    border-radius:10px;padding:9px 11px;margin:0 0 14px;line-height:1.5;
  }
  .modal-err.show{display:block}
  .row{display:flex;gap:9px;margin-top:4px}
  .btn{
    flex:1;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);
    padding:12px 10px;font-size:14px;font-weight:600;color:#c9ced6;transition:.15s ease;
  }
  .btn:hover{background:#1d222a}
  .btn.primary{
    background:linear-gradient(160deg,#ff4b3c,#c22c22);border-color:transparent;color:#fff;
    box-shadow:0 10px 24px -16px rgba(226,56,43,.95);
  }
  .btn.primary:hover{filter:brightness(1.07)}
  .btn[disabled]{opacity:.6;pointer-events:none}
  .btn.ghost-danger{
    flex:0 0 auto;width:auto;padding:12px 14px;color:#ff9a90;
    border-color:rgba(226,56,43,.32);background:rgba(226,56,43,.08);font-weight:500;font-size:12.5px;
  }
  .sheet-foot{margin-top:14px;font-size:11px;color:#565e69;line-height:1.6;text-align:center}

  @media (max-width:420px){
    .app{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    .bubble{max-width:88%;font-size:14.5px}
    .sheet{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-txt">
        <h1>Assistant</h1>
        <p class="status" id="status" data-state="checking"><span class="dot"></span><span id="statusText">연결 확인 중</span></p>
      </div>
    </div>
    <button class="icon-btn" id="openSettings" type="button" aria-label="설정 열기" title="설정">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.61.63 1.09 1.24 1.24H21a2 2 0 1 1 0 4h-.09c-.61.15-1.1.63-1.24 1.24z"></path>
      </svg>
    </button>
  </header>

  <main class="chat" id="chat" aria-live="polite" aria-label="대화 내용"></main>

  <div class="chips" id="chips" aria-label="빠른 명령">
    <button class="chip" type="button" data-cmd="오늘 일정 알려줘">오늘 일정</button>
    <button class="chip" type="button" data-cmd="내 할 일 목록 보여줘">내 할 일</button>
    <button class="chip" type="button" data-cmd="공용 시트 내용 보여줘">공용 시트 보기</button>
    <button class="chip" type="button" data-cmd="최근 메일 요약해줘">최근 메일</button>
  </div>

  <form class="composer" id="composerForm" autocomplete="off">
    <textarea id="input" rows="1" placeholder="무엇이든 물어보세요" aria-label="메시지 입력" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" type="submit" aria-label="보내기" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path>
      </svg>
    </button>
  </form>
  <p class="hint">PIN과 서버 주소는 이 기기 브라우저에만 저장됩니다</p>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <h2 id="modalTitle">연결 설정</h2>
    <p class="sub">Apps Script 웹 앱 주소와 접속 PIN을 입력하세요. 값은 이 브라우저에만 저장되고 서버로는 요청 본문에만 전달됩니다.</p>

    <div class="modal-err" id="modalErr"></div>

    <div class="field">
      <label for="urlInput">웹 앱 URL (/exec)</label>
      <input id="urlInput" type="url" inputmode="url" spellcheck="false" autocapitalize="off"
             placeholder="https://script.google.com/macros/s/.../exec" />
    </div>
    <div class="field">
      <label for="pinInput">접속 PIN</label>
      <input id="pinInput" type="password" inputmode="text" spellcheck="false" autocapitalize="off"
             autocomplete="current-password" placeholder="서버에 등록한 ACCESS_PIN" />
    </div>

    <p class="note">
      Apps Script 배포 시 <b>실행 계정: 나</b>, <b>액세스 권한: 모든 사용자</b>로 설정해야 브라우저에서 호출됩니다.
      실제 인증은 PIN이 담당합니다.
    </p>

    <div class="row">
      <button class="btn primary" id="saveBtn" type="button">저장 후 연결 확인</button>
      <button class="btn" id="cancelBtn" type="button">닫기</button>
      <button class="btn ghost-danger" id="clearBtn" type="button" title="저장된 대화를 지웁니다">대화 지우기</button>
    </div>
    <p class="sheet-foot">PIN을 잊었다면 Apps Script의 스크립트 속성에서 다시 확인할 수 있습니다.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEYS = { url: 'asst.url', pin: 'asst.pin', hist: 'asst.hist', welcome: 'asst.welcomed' };
  var SEND_HISTORY = 20;
  var STORE_HISTORY = 60;

  var chatEl = document.getElementById('chat');
  var formEl = document.getElementById('composerForm');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var chipsEl = document.getElementById('chips');
  var statusEl = document.getElementById('status');
  var statusTextEl = document.getElementById('statusText');
  var modalEl = document.getElementById('modal');
  var urlInput = document.getElementById('urlInput');
  var pinInput = document.getElementById('pinInput');
  var modalErr = document.getElementById('modalErr');
  var saveBtn = document.getElementById('saveBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var clearBtn = document.getElementById('clearBtn');

  var cfg = { url: '', pin: '' };
  var history = [];
  var busy = false;

  /* ---------- storage ---------- */

  function loadConfig() {
    try {
      cfg.url = localStorage.getItem(KEYS.url) || '';
      cfg.pin = localStorage.getItem(KEYS.pin) || '';
    } catch (e) { cfg = { url: '', pin: '' }; }
  }

  function saveConfig() {
    try {
      localStorage.setItem(KEYS.url, cfg.url);
      localStorage.setItem(KEYS.pin, cfg.pin);
    } catch (e) { /* 사파리 프라이빗 모드 등 */ }
  }

  function loadHistory() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEYS.hist) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw.filter(function (m) {
        return m && typeof m.text === 'string' && m.text &&
          (m.role === 'user' || m.role === 'assistant');
      }).map(function (m) {
        return { role: m.role, text: m.text, at: m.at || '' };
      });
    } catch (e) { return []; }
  }

  function saveHistory() {
    try { localStorage.setItem(KEYS.hist, JSON.stringify(history.slice(-STORE_HISTORY))); }
    catch (e) { /* 용량 초과 등은 무시 */ }
  }

  /* ---------- ui helpers ---------- */

  function setStatus(state, text) {
    statusEl.setAttribute('data-state', state);
    statusTextEl.textContent = text;
  }

  function timeLabel(iso) {
    var d = iso ? new Date(iso) : new Date();
    if (isNaN(d.getTime())) d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function richText(text) {
    var safe = escapeHtml(text);
    return safe
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  }

  function scrollToEnd(smooth) {
    requestAnimationFrame(function () {
      chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: smooth === false ? 'auto' : 'smooth' });
    });
  }

  function addMessage(role, text, opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (opts.error ? ' error' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'user') bubble.textContent = text;
    else bubble.innerHTML = richText(text);
    wrap.appendChild(bubble);

    var stamp = document.createElement('div');
    stamp.className = 'stamp';
    stamp.textContent = timeLabel(opts.at);
    wrap.appendChild(stamp);

    chatEl.appendChild(wrap);
    scrollToEnd();
    return wrap;
  }

  function addLoader() {
    var wrap = document.createElement('div');
    wrap.className = 'msg bot';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var t = document.createElement('span');
    t.className = 'typing';
    t.innerHTML = '<i></i><i></i><i></i>';
    bubble.appendChild(t);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    scrollToEnd();
    return wrap;
  }

  function showWelcome() {
    if (chatEl.querySelector('.welcome')) return;
    var box = document.createElement('div');
    box.className = 'welcome';
    box.innerHTML =
      '<h2>무엇을 도와드릴까요</h2>' +
      '<p>일정 조회와 추가, 할 일 확인, 공용 시트 열람·기록, 메일 검색을 도구로 직접 확인해 답합니다.</p>' +
      '<ul>' +
      '<li>“내일 오후 3시에 치과 일정 잡아줘”</li>' +
      '<li>“이번 주 남은 할 일 정리해줘”</li>' +
      '<li>“공용 시트에 오늘 지출 기록해줘”</li>' +
      '</ul>';
    chatEl.appendChild(box);
  }

  function renderAll() {
    chatEl.innerHTML = '';
    if (!history.length) { showWelcome(); return; }
    history.forEach(function (m) { addMessage(m.role, m.text, { at: m.at }); });
    scrollToEnd(false);
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v || !inputEl.value.trim();
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) {
      if (v) c.setAttribute('disabled', 'disabled');
      else c.removeAttribute('disabled');
    });
  }

  /* ---------- network ---------- */

  function post(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.text().then(function (raw) {
        var data;
        try { data = JSON.parse(raw); }
        catch (e) {
          throw new Error('서버 응답을 해석하지 못했습니다. 배포 URL과 액세스 권한 “모든 사용자”를 확인하세요.');
        }
        if (!data || typeof data !== 'object') throw new Error('서버 응답 형식이 올바르지 않습니다.');
        return data;
      });
    }, function () {
      throw new Error('서버에 연결하지 못했습니다. 네트워크와 배포 URL을 확인하세요.');
    });
  }

  function ping(url, pin) {
    return post(url, { action: 'ping', pin: pin });
  }

  function verifyConnection(silent) {
    if (!cfg.url || !cfg.pin) {
      setStatus('error', '설정 필요');
      return Promise.resolve(false);
    }
    setStatus('checking', '연결 확인 중');
    return ping(cfg.url, cfg.pin).then(function (data) {
      if (data.ok) {
        setStatus('ok', '연결됨');
        return true;
      }
      var msg = data.error || '연결을 확인하지 못했습니다.';
      setStatus('error', data.status === 401 ? 'PIN 불일치' : '연결 오류');
      if (!silent) addMessage('assistant', msg, { error: true });
      return false;
    }).catch(function (err) {
      setStatus('error', '연결 오류');
      if (!silent) addMessage('assistant', err.message, { error: true });
      return false;
    });
  }

  /* ---------- send ---------- */

  function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;

    if (!cfg.url || !cfg.pin) {
      openModal(true);
      return;
    }

    var prior = history.slice(-(SEND_HISTORY + 1), -1).map(function (m) {
      return { role: m.role, text: m.text };
    });

    addMessage('user', text);
    history.push({ role: 'user', text: text, at: new Date().toISOString() });
    saveHistory();

    inputEl.value = '';
    autosize();
    setBusy(true);
    var loader = addLoader();

    post(cfg.url, { pin: cfg.pin, message: text, history: prior })
      .then(function (data) {
        loader.remove();
        if (!data.ok) {
          var err = new Error(data.error || ('서버 오류 (' + (data.status || '?') + ')'));
          err.status = data.status;
          throw err;
        }
        var reply = (typeof data.reply === 'string' && data.reply.trim()) ?
          data.reply.trim() : '응답이 비어 있습니다. 다시 시도해 주세요.';
        addMessage('assistant', reply);
        history.push({ role: 'assistant', text: reply, at: new Date().toISOString() });
        saveHistory();
        setStatus('ok', '연결됨');
      })
      .catch(function (err) {
        if (loader.parentNode) loader.remove();
        addMessage('assistant', err.message || '알 수 없는 오류가 발생했습니다.', { error: true });
        if (err.status === 401) {
          setStatus('error', 'PIN 불일치');
          openModal(false, 'PIN이 맞지 않습니다. 설정에서 다시 입력해 주세요.');
        } else {
          setStatus('error', '연결 오류');
        }
      })
      .then(function () {
        setBusy(false);
        inputEl.focus();
      });
  }

  /* ---------- composer ---------- */

  function autosize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    sendBtn.disabled = busy || !inputEl.value.trim();
  }

  inputEl.addEventListener('input', autosize);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(inputEl.value);
    }
  });

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    send(inputEl.value);
  });

  chipsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn || btn.hasAttribute('disabled')) return;
    send(btn.getAttribute('data-cmd'));
  });

  /* ---------- modal ---------- */

  function openModal(firstRun, errorText) {
    urlInput.value = cfg.url || '';
    pinInput.value = cfg.pin || '';
    modalErr.classList.remove('show');
    modalErr.textContent = '';
    if (errorText) { modalErr.textContent = errorText; modalErr.classList.add('show'); }
    cancelBtn.style.display = firstRun ? 'none' : '';
    clearBtn.style.display = cfg.url ? '' : 'none';
    modalEl.classList.add('open');
    setTimeout(function () { (urlInput.value ? pinInput : urlInput).focus(); }, 60);
  }

  function closeModal() {
    modalEl.classList.remove('open');
  }

  function showModalError(msg) {
    modalErr.textContent = msg;
    modalErr.classList.add('show');
  }

  document.getElementById('openSettings').addEventListener('click', function () { openModal(false); });
  cancelBtn.addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) { if (e.target === modalEl && !modalEl.dataset.locked) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalEl.classList.contains('open') && !modalEl.dataset.locked) closeModal();
  });

  saveBtn.addEventListener('click', function () {
    var url = urlInput.value.trim().replace(/\s/g, '');
    var pin = pinInput.value.trim();

    if (!/^https:\/\/\S+$/i.test(url)) {
      showModalError('https:// 로 시작하는 웹 앱 URL을 입력하세요.');
      return;
    }
    if (!pin) {
      showModalError('접속 PIN을 입력하세요.');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = '확인 중…';
    modalErr.classList.remove('show');

    ping(url, pin).then(function (data) {
      if (data.ok) {
        cfg.url = url;
        cfg.pin = pin;
        saveConfig();
        delete modalEl.dataset.locked;
        closeModal();
        setStatus('ok', '연결됨');
        addMessage('assistant', '연결되었습니다. 무엇을 도와드릴까요?');
        inputEl.focus();
      } else if (data.status === 401) {
        showModalError('PIN이 올바르지 않습니다. 서버의 ACCESS_PIN과 같은지 확인하세요.');
      } else {
        showModalError(data.error || '응답을 확인하지 못했습니다.');
      }
    }).catch(function (err) {
      showModalError(err.message + ' 배포가 “모든 사용자”인지 확인하세요.');
    }).then(function () {
      saveBtn.disabled = false;
      saveBtn.textContent = '저장 후 연결 확인';
    });
  });

  clearBtn.addEventListener('click', function () {
    if (!confirm('저장된 대화 기록을 지울까요? (서버 설정은 유지됩니다)')) return;
    history = [];
    saveHistory();
    renderAll();
    closeModal();
  });

  /* ---------- boot ---------- */

  loadConfig();
  history = loadHistory();

  if (!cfg.url || !cfg.pin) {
    modalEl.dataset.locked = '1';
    openModal(true);
    setStatus('error', '설정 필요');
  } else {
    renderAll();
    verifyConnection(true);
  }

  autosize();
})();
</script>
</body>
</html>
